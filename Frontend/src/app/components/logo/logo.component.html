<span class="dp-logo">
  <svg
    class="dp-logo__mark"
    [attr.width]="size"
    [attr.height]="size"
    viewBox="0 0 32 32"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    role="img"
    aria-label="DevPilot"
  >
    <rect width="32" height="32" rx="9" fill="url(#dp-logo-grad)" />
    <path
      d="M11.5 9.5L20.5 16L11.5 22.5"
      stroke="white"
      stroke-width="2.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="23.5" cy="9.5" r="2.1" fill="#5EEAD4" />
    <defs>
      <linearGradient id="dp-logo-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#6366F1" />
        <stop offset="1" stop-color="#8B5CF6" />
      </linearGradient>
    </defs>
  </svg>
  @if (showWordmark) {
    <span class="dp-logo__word">DevPilot</span>
  }
</span>
