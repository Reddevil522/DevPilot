<footer class="devpilot-footer">
  <div class="dp-container devpilot-footer__inner">
    <div class="devpilot-footer__brand">
      <dp-logo [size]="26"></dp-logo>
      <p class="devpilot-footer__tagline">AI-powered development for modern builders.</p>
      <div class="devpilot-footer__social">
        <a href="#" aria-label="DevPilot on GitHub" class="devpilot-footer__social-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.3 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/></svg>
        </a>
        <a href="#" aria-label="DevPilot on X" class="devpilot-footer__social-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-7l-5.5-7.2L4.6 22H1.5l8.1-9.3L1 2h7.2l5 6.6L18.9 2Zm-1.2 18h1.7L7.4 3.9H5.6L17.7 20Z"/></svg>
        </a>
        <a href="#" aria-label="DevPilot on LinkedIn" class="devpilot-footer__social-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6.94 5a2 2 0 1 1-4 0 2 2 0 0 1 4 0ZM3.3 8.75h3.4V21H3.3V8.75Zm6.2 0h3.26v1.68h.05c.45-.86 1.56-1.77 3.22-1.77 3.44 0 4.08 2.27 4.08 5.22V21h-3.4v-5.55c0-1.32-.02-3.02-1.84-3.02-1.85 0-2.13 1.44-2.13 2.93V21H9.5V8.75Z"/></svg>
        </a>
      </div>
    </div>

    @for (col of columns; track col.title) {
      <div class="devpilot-footer__col">
        <h3>{{ col.title }}</h3>
        <ul>
          @for (link of col.links; track link) {
            <li><a href="#">{{ link }}</a></li>
          }
        </ul>
      </div>
    }
  </div>

  <div class="dp-container devpilot-footer__bottom">
    <p>© {{ year }} DevPilot. All rights reserved.</p>
  </div>
</footer>
