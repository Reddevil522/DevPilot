<section class="devpilot-productivity">
  <div class="dp-container devpilot-productivity__panel dp-glass">
    <h2 class="devpilot-productivity__title">
      From idea to deployment without leaving your workspace.
    </h2>

    <div class="devpilot-productivity__grid">
      @for (item of benefits; track item) {
        <div class="devpilot-productivity__item">
          <span class="devpilot-productivity__check">✓</span>
          {{ item }}
        </div>
      }
    </div>
  </div>
</section>
